[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-evaluation-toolkit"
version = "0.1.0"
description = "Reproducible RAG evaluation with deterministic metrics, optional LLM judges, and benchmarks."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "lordarcane666"}]
dependencies = ["pydantic>=2.10,<3"]
keywords = ["rag", "evaluation", "llm", "nlp", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11", "mypy>=1.15,<3", "build>=1.2,<2"]

[project.scripts]
rag-eval = "rag_eval_toolkit.cli.app:main"

[project.urls]
Repository = "https://github.com/lordarcane666/rag-evaluation-toolkit"
Issues = "https://github.com/lordarcane666/rag-evaluation-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_eval_toolkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/rag_eval_toolkit"]
